name: Validate

on:
  # Branch pushes are covered by pull_request; push only runs for main.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot keeps them current. The HACS
# and hassfest validators are the exception: they publish no maintained tags
# (so Dependabot can't update a pin) and recommend tracking their default
# branch, so CI checks against the current rules. The token is read-only.
jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      # Brings in Home Assistant for tests/ha; the library tests alone need
      # only aiohttp, pytest and pytest-asyncio.
      - run: pip install -r requirements_test.txt
      - run: pytest -q
